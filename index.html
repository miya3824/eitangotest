<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>中学英単語 完全習得ドリル</title>
<style>
  :root {
    --primary: #2f6fed;
    --primary-dark: #1f55c4;
    --primary-soft: #e8efff;
    --bg: #eef3fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7489;
    --border: #d6deeb;
    --correct: #18a058;
    --correct-bg: #e5f7ed;
    --wrong: #e5484d;
    --wrong-bg: #fdecec;
    --hint-bg: #fff8e1;
    --hint-border: #f2c94c;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; }
  .screen { display: none; flex: 1; flex-direction: column; animation: fade .25s ease; }
  .screen.active { display: flex; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(31, 60, 120, .08);
    padding: 24px 20px;
  }

  /* ボタン共通 */
  .btn {
    display: block; width: 100%;
    min-height: 56px;
    border: none; border-radius: 14px;
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease, opacity .15s ease;
    font-family: inherit;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 0 var(--primary-dark); }
  .btn-primary:active { box-shadow: 0 1px 0 var(--primary-dark); transform: translateY(3px); }
  .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }

  /* タイトル画面 */
  #title-screen { justify-content: center; text-align: center; gap: 18px; }
  .logo { font-size: 56px; line-height: 1; }
  .title-main { font-size: 28px; font-weight: 800; margin: 8px 0 4px; line-height: 1.35; }
  .title-sub { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.6; }
  .status { font-size: 14px; color: var(--muted); min-height: 1.5em; white-space: pre-line; line-height: 1.6; }
  .status.warn { color: #b7791f; }
  .spinner {
    display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px;
    border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 級・セット選択 */
  .select-block { text-align: left; }
  .select-heading { font-size: 15px; font-weight: 700; color: var(--muted); margin: 0 0 8px 2px; }
  .grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .pick-btn {
    background: #fff; color: var(--text); border: 2px solid var(--border);
    min-height: 64px; padding: 6px 4px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .pick-btn .main { font-size: 18px; font-weight: 800; }
  .pick-btn .cnt { font-size: 12px; font-weight: 600; color: var(--muted); }
  .pick-btn.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
  .pick-btn.selected .cnt { color: var(--primary); }
  .empty-note { font-size: 14px; color: var(--muted); padding: 8px 2px; }

  /* クイズ画面 */
  #quiz-screen { gap: 14px; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; color: var(--muted); font-size: 15px; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); width: 0; transition: width .3s ease; }
  .word-card { text-align: center; padding: 28px 16px; }
  .word-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .word { font-size: 40px; font-weight: 800; letter-spacing: .02em; word-break: break-word; }

  .hint-toggle {
    background: transparent; border: 2px dashed var(--hint-border); color: #8a6d00;
    min-height: 48px; font-size: 16px;
  }
  .hint-area { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .hint-area.open { grid-template-rows: 1fr; }
  .hint-inner { overflow: hidden; }
  .hint-box {
    background: var(--hint-bg); border: 1px solid var(--hint-border); border-radius: 12px;
    padding: 14px 16px; margin-top: 2px;
  }
  .hint-sentence { font-size: 17px; font-weight: 600; line-height: 1.5; margin: 0 0 6px; }
  .hint-ja { font-size: 15px; color: #5c4b00; line-height: 1.5; margin: 0; }

  .choices { display: grid; gap: 10px; }
  .choice {
    background: #fff; color: var(--text); border: 2px solid var(--border);
    text-align: left; padding: 12px 18px; font-size: 18px; font-weight: 600;
    display: flex; align-items: center; gap: 12px;
  }
  .choice .num {
    flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--bg); color: var(--primary);
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;
  }
  .choice.correct { border-color: var(--correct); background: var(--correct-bg); }
  .choice.correct .num { background: var(--correct); color: #fff; }
  .choice.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .choice.wrong .num { background: var(--wrong); color: #fff; }
  .choice:disabled { opacity: 1; }
  .choice.dim { opacity: .55; }

  .feedback {
    display: none; text-align: center; font-size: 22px; font-weight: 800;
    padding: 14px; border-radius: 12px;
  }
  .feedback.show { display: block; animation: pop .25s ease; }
  .feedback.ok { color: var(--correct); background: var(--correct-bg); }
  .feedback.ng { color: var(--wrong); background: var(--wrong-bg); font-size: 19px; }
  @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
  #next-btn { display: none; }
  #next-btn.show { display: block; }

  /* 結果画面 */
  #result-screen { justify-content: center; text-align: center; gap: 20px; }
  .score { font-size: 48px; font-weight: 800; color: var(--primary); margin: 8px 0; }
  .score-msg { font-size: 17px; color: var(--muted); margin: 0; }
  .review { text-align: left; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .review-item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; font-size: 15px; border-bottom: 1px solid #f0f3f8; }
  .review-item b { font-size: 16px; }
  .result-actions { display: grid; gap: 10px; }

  @media (min-width: 600px) {
    body { padding-top: 40px; }
    .word { font-size: 46px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- タイトル画面 -->
  <section id="title-screen" class="screen active">
    <div class="card">
      <div class="logo">📘</div>
      <h1 class="title-main">中学英単語<br>完全習得ドリル</h1>
      <p class="title-sub">英検4級〜1級の単語を4択でマスターしよう！</p>
    </div>
    <div id="load-status" class="status"><span class="spinner"></span>単語データを読み込み中...</div>

    <div class="select-block">
      <p class="select-heading">① 級を選んでね</p>
      <div id="grades" class="grades"></div>
    </div>
    <div class="select-block">
      <p class="select-heading">② セットを選んでね</p>
      <div id="sets" class="sets"></div>
    </div>

    <button id="start-btn" class="btn btn-primary" disabled>スタート</button>
  </section>

  <!-- クイズ画面 -->
  <section id="quiz-screen" class="screen">
    <div class="progress-row">
      <span id="progress-text">第1問 / 全20問</span>
      <span id="score-text">正解 0</span>
    </div>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>

    <div class="card word-card">
      <div id="range-label" class="word-label">この英単語の意味は？</div>
      <div id="word" class="word">---</div>
    </div>

    <button id="hint-btn" class="btn hint-toggle" aria-expanded="false" aria-controls="hint-area">💡 ヒントを見る</button>
    <div id="hint-area" class="hint-area" aria-hidden="true">
      <div class="hint-inner">
        <div class="hint-box">
          <p id="hint-sentence" class="hint-sentence"></p>
          <p id="hint-ja" class="hint-ja"></p>
        </div>
      </div>
    </div>

    <div id="choices" class="choices"></div>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    <button id="next-btn" class="btn btn-primary">次へ</button>
  </section>

  <!-- 結果画面 -->
  <section id="result-screen" class="screen">
    <div class="card">
      <div class="logo" id="result-emoji">🎉</div>
      <div id="score" class="score">0問正解！</div>
      <p id="score-msg" class="score-msg"></p>
      <div id="review" class="review"></div>
    </div>
    <div class="result-actions">
      <button id="retry-btn" class="btn btn-primary">もう一度挑戦する</button>
      <button id="next-set-btn" class="btn btn-outline">次のセットへ</button>
      <button id="back-btn" class="btn btn-outline">級・セットを選び直す</button>
    </div>
  </section>

</div>

<script>
const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7fDrJNr5HALyJWBLEvyOpAUgb2xr_GcVdVlxxgJBaYolIUoOjkm_FtzO4JkIlVJCqWZRMZ6DbqutO/pub?gid=1917643761&single=true&output=csv";

/* ===== 設定 ===== */
const FETCH_TIMEOUT_MS = 8000; // 通信タイムアウト

// 級の表示順。MAIN_GRADES は常に表示、EXTRA_GRADES はデータがあるときだけ表示
const MAIN_GRADES  = ["4級", "3級", "準2級", "2級", "準1級", "1級"];
const EXTRA_GRADES = ["5級", "準2級プラス"];
const GRADE_ORDER  = ["5級", "4級", "3級", "準2級", "準2級プラス", "2級", "準1級", "1級"];

/*
  CSVの列構成（1行目の項目名で列を探すので、順番を入れ替えても動きます）
  A: number / B: vocab / C: grade / D: set / E: sentence / F: Hint / G: answer / H〜J: dummy1〜3
*/
const DEFAULT_COLUMNS = { number: 0, vocab: 1, grade: 2, set: 3, sentence: 4, hint: 5, answer: 6, dummy1: 7, dummy2: 8, dummy3: 9 };

/* ===== フォールバック用（予備）データ ===== */
const FALLBACK_WORDS = [
  { vocab: "dog",   grade: "4級", set: 1, sentence: "I love playing with my【dog】.",                          hint: "僕は自分の【dog】と遊ぶのが大好きなんだ！",       answer: "犬",         dummies: ["友達", "ペット", "弟"] },
  { vocab: "cat",   grade: "4級", set: 1, sentence: "The【cat】doesn't seem interested in her toy.",             hint: "その【cat】は自分のおもちゃに興味がないみたい。", answer: "猫",         dummies: ["子ども", "オオカミ", "赤ちゃん"] },
  { vocab: "bark",  grade: "4級", set: 1, sentence: "I tell my dog not to 【bark】.",                            hint: "犬に【bark】しないように言ったんだ。",           answer: "(犬が)鳴く", dummies: ["飛び跳ねる", "喧嘩する", "興奮する"] },
  { vocab: "meow",  grade: "4級", set: 1, sentence: "I thought I heard a cat 【meow】.",                         hint: "猫が【meow】するのが聞こえた気がしたのに。",     answer: "(猫が)鳴く", dummies: ["悲しむ", "呼ぶ", "ミルクを飲む"] },
  { vocab: "large", grade: "4級", set: 1, sentence: "This cat isn't as 【large】as that dog.",                   hint: "その猫は犬ほど【large】ではない。",               answer: "大きい",     dummies: ["小さい", "立派な", "可愛い"] },
  { vocab: "small", grade: "4級", set: 1, sentence: "The kitten is so【small】 that I thought it was an angel.", hint: "その子猫、【small】すぎて天使かと思った。",       answer: "小さい",     dummies: ["大きい", "若い", "美しい"] }
];

/* ===== 状態 ===== */
let wordList = [];
let selectedGrade = null;
let selectedSet = null;
let questions = [];
let current = 0;
let score = 0;
let history = [];

/* ===== 要素 ===== */
const $ = (id) => document.getElementById(id);
const screens = { title: $("title-screen"), quiz: $("quiz-screen"), result: $("result-screen") };

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
  window.scrollTo(0, 0);
}

/* ===== CSVパーサー（ダブルクォート・カンマ・改行入りセル対応） ===== */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  text = text.replace(/^﻿/, ""); // BOM除去
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* 全角英数字→半角、空白除去 */
const toHalf = (s) => (s || "").replace(/[０-９Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/\s+/g, "");

/* 級の表記ゆれをそろえる（例: "準２級"→"準2級", "3"→"3級", "準2+"→"準2級プラス"） */
function normalizeGrade(raw) {
  let g = toHalf(raw).replace(/^英検/, "");
  if (!g) return "";
  g = g.replace(/\+$|＋$/, "プラス");
  if (/^準?\d(プラス)?$/.test(g)) g = g.replace(/^(準?\d)/, "$1級");
  return g;
}

/* 1行目の項目名から列番号を決める */
function detectColumns(header) {
  const names = header.map(h => toHalf(h).toLowerCase());
  if (!names.includes("vocab")) return DEFAULT_COLUMNS; // 項目名が見つからなければ標準の列順
  const idx = (key) => names.indexOf(key);
  return {
    number: idx("number"), vocab: idx("vocab"), grade: idx("grade"), set: idx("set"),
    sentence: idx("sentence"), hint: idx("hint"), answer: idx("answer"),
    dummy1: idx("dummy1"), dummy2: idx("dummy2"), dummy3: idx("dummy3")
  };
}

let skippedWords = []; // vocab はあるが answer か grade が空で出題できない単語

function rowsToWords(rows) {
  skippedWords = [];
  if (rows.length < 2) return [];
  const col = detectColumns(rows[0]);
  const get = (cols, key) => (col[key] >= 0 ? (cols[col[key]] || "") : "").trim();
  const parsed = rows.slice(1) // 1行目（ヘッダー）を飛ばす
    .map((cols, i) => {
      const setNum = parseInt(toHalf(get(cols, "set")), 10);
      return {
        number:   parseInt(get(cols, "number"), 10) || (i + 1),
        vocab:    get(cols, "vocab"),
        grade:    normalizeGrade(get(cols, "grade")),
        set:      Number.isFinite(setNum) ? setNum : 0, // 空欄は 0（「セットなし」）
        sentence: get(cols, "sentence"),
        hint:     get(cols, "hint"),
        answer:   get(cols, "answer"),
        dummies:  ["dummy1", "dummy2", "dummy3"].map(k => get(cols, k)).filter(Boolean)
      };
    })
    .filter(w => w.vocab);
  skippedWords = parsed.filter(w => !w.answer || !w.grade);
  return parsed.filter(w => w.answer && w.grade);
}

/* ===== データ読み込み ===== */
async function loadWords() {
  const status = $("load-status");
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    const res = await fetch(SPREADSHEET_CSV_URL, { signal: controller.signal, cache: "no-store" });
    clearTimeout(timer);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error("CSVではなくHTMLが返されました");
    const words = rowsToWords(parseCSV(text));
    if (words.length === 0) {
      throw new Error(skippedWords.length
        ? `answer（正解）列が空の単語しかありません（${skippedWords.length}語）`
        : "有効な単語データがありません（grade 列を確認してください）");
    }
    wordList = words;
    status.className = "status";
    status.textContent = `✅ ${words.length}語の単語データを読み込みました` +
      (skippedWords.length ? `（answer が空の${skippedWords.length}語は出題されません）` : "");
  } catch (err) {
    console.warn("スプレッドシートの読み込みに失敗。予備データを使用します:", err);
    wordList = FALLBACK_WORDS.map((w, i) => ({ ...w, number: i + 1 }));
    status.className = "status warn";
    const reason = err && err.name === "AbortError" ? "通信がタイムアウトしました"
                 : err && err.name === "TypeError"  ? "通信できませんでした（ネット接続か、開き方を確認してください）"
                 : (err && err.message) || "不明なエラー";
    status.textContent = `⚠️ オンラインのデータを読み込めなかったため、予備データ（${FALLBACK_WORDS.length}語）で出題します\n理由：${reason}`;
  }
  renderSelectors();
}

/* ===== 級・セット選択 ===== */
const wordsOf = (grade, set) => wordList.filter(w => w.grade === grade && (set === undefined || w.set === set));
const setsOf = (grade) => [...new Set(wordsOf(grade).map(w => w.set))].sort((a, b) => (a || Infinity) - (b || Infinity));
const setLabel = (set) => set ? `セット${set}` : "セットなし";

function visibleGrades() {
  const known = GRADE_ORDER.filter(g => MAIN_GRADES.includes(g) || wordsOf(g).length > 0);
  const unknown = [...new Set(wordList.map(w => w.grade))].filter(g => !GRADE_ORDER.includes(g));
  return [...known, ...unknown];
}

function renderSelectors() {
  const grades = visibleGrades();
  if (!selectedGrade || wordsOf(selectedGrade).length === 0) {
    selectedGrade = grades.find(g => wordsOf(g).length > 0) || null;
    selectedSet = null;
  }

  // 級ボタン
  const gBox = $("grades");
  gBox.innerHTML = "";
  grades.forEach(g => {
    const count = wordsOf(g).length;
    const btn = document.createElement("button");
    btn.className = "btn pick-btn" + (g === selectedGrade ? " selected" : "");
    btn.disabled = count === 0;
    btn.innerHTML = `<span class="main"></span><span class="cnt">${count ? count + "語" : "準備中"}</span>`;
    btn.querySelector(".main").textContent = g;
    btn.addEventListener("click", () => { selectedGrade = g; selectedSet = null; renderSelectors(); });
    gBox.appendChild(btn);
  });

  // セットボタン
  const sBox = $("sets");
  sBox.innerHTML = "";
  const sets = selectedGrade ? setsOf(selectedGrade) : [];
  if (!sets.includes(selectedSet)) selectedSet = sets.length ? sets[0] : null;
  if (sets.length === 0) {
    sBox.innerHTML = `<div class="empty-note">単語が登録されている級を選んでください</div>`;
  }
  sets.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "btn pick-btn" + (s === selectedSet ? " selected" : "");
    btn.innerHTML = `<span class="main">${setLabel(s)}</span><span class="cnt">${wordsOf(selectedGrade, s).length}問</span>`;
    btn.addEventListener("click", () => { selectedSet = s; renderSelectors(); });
    sBox.appendChild(btn);
  });

  $("start-btn").disabled = selectedSet === null;
}

/* ===== ユーティリティ ===== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildChoices(word) {
  let dummies = [...new Set(word.dummies)].filter(d => d !== word.answer);
  // ダミーが3つ未満の場合は他の単語の正解で補う（同じ級を優先）
  if (dummies.length < 3) {
    const same = shuffle(wordsOf(word.grade).map(w => w.answer));
    const other = shuffle(wordList.filter(w => w.grade !== word.grade).map(w => w.answer));
    const pool = [...new Set([...same, ...other])]
      .filter(a => a !== word.answer && !dummies.includes(a));
    dummies = dummies.concat(pool).slice(0, 3);
  }
  return shuffle([word.answer, ...dummies.slice(0, 3)]);
}

/* ===== ゲーム進行 ===== */
function startGame() {
  if (selectedSet === null) return;
  // 選んだ級・セットの単語をすべて、ランダムな順番で出題
  questions = shuffle(wordsOf(selectedGrade, selectedSet))
    .map(w => ({ ...w, choices: buildChoices(w) }));
  if (questions.length === 0) return;
  current = 0;
  score = 0;
  history = [];
  $("range-label").textContent = `英検${selectedGrade}・${setLabel(selectedSet)}`;
  showScreen("quiz");
  renderQuestion();
}

function setHint(open) {
  $("hint-area").classList.toggle("open", open);
  $("hint-area").setAttribute("aria-hidden", String(!open));
  $("hint-btn").setAttribute("aria-expanded", String(open));
  $("hint-btn").textContent = open ? "💡 ヒントを閉じる" : "💡 ヒントを見る";
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;
  $("progress-text").textContent = `第${current + 1}問 / 全${total}問`;
  $("score-text").textContent = `正解 ${score}`;
  $("progress-fill").style.width = `${(current / total) * 100}%`;
  $("word").textContent = q.vocab;

  // ヒントは毎問リセット（非表示）
  setHint(false);
  $("hint-sentence").textContent = q.sentence || "（例文はありません）";
  $("hint-ja").textContent = q.hint || "";
  $("hint-btn").style.display = (q.sentence || q.hint) ? "" : "none";

  const box = $("choices");
  box.innerHTML = "";
  q.choices.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "btn choice";
    btn.innerHTML = `<span class="num">${i + 1}</span><span class="label"></span>`;
    btn.querySelector(".label").textContent = choice;
    btn.addEventListener("click", () => answer(btn, choice));
    box.appendChild(btn);
  });

  const fb = $("feedback");
  fb.className = "feedback";
  fb.textContent = "";
  $("next-btn").classList.remove("show");
}

function answer(selectedBtn, choice) {
  const q = questions[current];
  const isCorrect = choice === q.answer;
  if (isCorrect) score++;
  history.push({ vocab: q.vocab, answer: q.answer, correct: isCorrect });

  document.querySelectorAll(".choice").forEach(btn => {
    btn.disabled = true;
    const label = btn.querySelector(".label").textContent;
    if (label === q.answer) btn.classList.add("correct");
    else if (btn === selectedBtn) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });

  const fb = $("feedback");
  if (isCorrect) {
    fb.textContent = "⭕ 正解！";
    fb.className = "feedback show ok";
  } else {
    fb.textContent = `❌ 残念！正解は「${q.answer}」`;
    fb.className = "feedback show ng";
  }
  $("score-text").textContent = `正解 ${score}`;
  const next = $("next-btn");
  next.textContent = current + 1 < questions.length ? "次へ" : "結果を見る";
  next.classList.add("show");
  next.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function nextQuestion() {
  current++;
  if (current < questions.length) renderQuestion();
  else showResult();
}

function nextSetOf(grade, set) {
  const sets = setsOf(grade);
  const i = sets.indexOf(set);
  return i >= 0 && i + 1 < sets.length ? sets[i + 1] : null;
}

function showResult() {
  const total = questions.length;
  $("score").textContent = `${score}問正解！`;
  const rate = score / total;
  const label = `英検${selectedGrade}・${setLabel(selectedSet)}：`;
  let emoji, msg;
  if (rate === 1)      { emoji = "🏆"; msg = `${label}全${total}問正解！パーフェクト！`; }
  else if (rate >= .6) { emoji = "🎉"; msg = `${label}${total}問中${score}問正解。その調子！`; }
  else                 { emoji = "💪"; msg = `${label}${total}問中${score}問正解。ヒントも使って復習しよう！`; }
  $("result-emoji").textContent = emoji;
  $("score-msg").textContent = msg;

  const review = $("review");
  review.innerHTML = "";
  history.forEach(h => {
    const item = document.createElement("div");
    item.className = "review-item";
    item.innerHTML = `<span>${h.correct ? "⭕" : "❌"} <b></b></span><span></span>`;
    item.querySelector("b").textContent = h.vocab;
    item.lastElementChild.textContent = h.answer;
    review.appendChild(item);
  });

  const nextSet = nextSetOf(selectedGrade, selectedSet);
  const nextBtn = $("next-set-btn");
  nextBtn.style.display = nextSet === null ? "none" : "";
  if (nextSet !== null) nextBtn.textContent = `次のセットへ（${setLabel(nextSet)}）`;

  showScreen("result");
}

/* ===== イベント ===== */
$("start-btn").addEventListener("click", startGame);
$("next-btn").addEventListener("click", nextQuestion);
$("retry-btn").addEventListener("click", startGame);
$("next-set-btn").addEventListener("click", () => {
  const nextSet = nextSetOf(selectedGrade, selectedSet);
  if (nextSet !== null) { selectedSet = nextSet; renderSelectors(); startGame(); }
});
$("back-btn").addEventListener("click", () => { renderSelectors(); showScreen("title"); });
$("hint-btn").addEventListener("click", () => {
  setHint(!$("hint-area").classList.contains("open"));
});

loadWords();
</script>
</body>
</html>
