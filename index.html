<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dde5ec">
<title>中学英単語 完全習得ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #dde5ec;      /* 机 */
    --paper: #fefefb;     /* ノートの紙 */
    --rule: #d3e3f3;      /* 罫線（水色） */
    --margin: #f2a9b0;    /* マージン線（赤） */
    --ink: #253552;       /* 紺のインク */
    --pencil: #6a7385;    /* 鉛筆の灰色 */
    --redpen: #e23b3b;    /* 先生の赤ペン */
    --marker: #ffe766;    /* 蛍光ペン */
    --sticky: #e1efff;    /* 水色の付箋 */
    --line-h: 32px;
    --hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", cursive;
    --ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--ui);
    font-weight: 500;
    background: var(--desk);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
  }

  /* ===== ノートのページ ===== */
  .app {
    position: relative;
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line-h) - 1px), var(--rule) calc(var(--line-h) - 1px), var(--rule) var(--line-h));
    background-position: 0 14px;
    border-radius: 4px 14px 14px 4px;
    box-shadow: 0 1px 0 #c5d0da, 0 10px 24px rgba(37, 53, 82, .12);
    padding: 22px 18px 24px 42px;
    min-height: calc(100dvh - 24px);
  }
  .app::before { /* 左の赤いマージン線 */
    content: ""; position: absolute; top: 0; bottom: 0; left: 28px;
    width: 1.5px; background: var(--margin);
  }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  /* ===== ボタン共通 ===== */
  .btn {
    display: block; width: 100%;
    min-height: 56px;
    font-family: var(--ui); font-size: 18px; font-weight: 700;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 12px;
    box-shadow: 3px 3px 0 rgba(37, 53, 82, .18);
    cursor: pointer;
    transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
  }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(37, 53, 82, .18); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible { outline: 3px solid #5b8fd9; outline-offset: 3px; }
  .btn-primary { background: var(--ink); color: #fff; box-shadow: 3px 3px 0 #9aa8bd; }
  .btn-primary:active:not(:disabled) { box-shadow: 1px 1px 0 #9aa8bd; }

  /* ===== タイトル画面 ===== */
  #title-screen { gap: 20px; }
  .title-main {
    font-family: var(--hand); font-weight: 600;
    font-size: 34px; line-height: 1.45; margin: 6px 0 0;
    letter-spacing: .02em;
  }
  .title-main .mark-line { /* 蛍光ペンを引いたような下線 */
    background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%);
    padding: 0 4px;
  }
  .title-sub { font-size: 15px; color: var(--pencil); margin: 0; line-height: 1.7; }
  .status { font-size: 13px; color: var(--pencil); white-space: pre-line; line-height: 1.6; margin: 0; }
  .status.warn { color: #a3610f; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px;
    border: 2.5px solid var(--rule); border-top-color: var(--ink); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .select-heading { font-family: var(--hand); font-weight: 600; font-size: 18px; margin: 0 0 10px; }

  /* 名前入力と累計 */
  .name-input {
    width: 100%; min-height: 52px; padding: 10px 14px;
    font-family: var(--ui); font-size: 18px; font-weight: 700; color: var(--ink);
    background: #fff; border: 1.5px solid var(--ink); border-radius: 12px;
  }
  .name-input::placeholder { color: #a3abba; font-weight: 500; }
  .id-fields { display: grid; grid-template-columns: 2fr 3fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field-label { font-size: 13px; color: var(--pencil); font-weight: 700; }
  .field .name-input { min-width: 0; }
  .name-input:focus-visible { outline: 3px solid #5b8fd9; outline-offset: 2px; }
  .totals { font-size: 14px; color: var(--pencil); margin: 8px 2px 0; line-height: 1.6; min-height: 1.6em; }
  .totals b { font-family: var(--hand); font-weight: 600; font-size: 18px; color: var(--ink); }
  .record-status { font-size: 14px; color: var(--pencil); margin: 0; line-height: 1.6; }
  .record-status.ok { color: #1f7a45; }
  .record-status.warn { color: #a3610f; }

  /* 級：インデックスシール風（上の色帯が級の色） */
  .grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
  .sets .pick-btn .main { font-size: 22px; }
  .sets .pick-btn.is-text .main { font-size: 15px; line-height: 1.3; word-break: break-all; }
  .pick-btn {
    min-height: 62px; padding: 8px 4px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    border-width: 1.5px; box-shadow: 2px 2px 0 rgba(37, 53, 82, .12);
    position: relative; overflow: hidden;
  }
  .pick-btn .main { font-size: 18px; font-weight: 900; }
  .pick-btn .cnt { font-size: 12px; color: var(--pencil); font-weight: 500; }
  .grades .pick-btn { border-top-width: 7px; border-top-color: var(--tab, var(--ink)); }
  .pick-btn.selected { background: var(--ink); color: #fff; }
  .pick-btn.selected .cnt { color: #d5deeb; }
  .empty-note { font-size: 14px; color: var(--pencil); padding: 6px 0; }

  /* ===== クイズ画面 ===== */
  #quiz-screen { gap: 14px; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 30px; }
  .progress-text { font-family: var(--hand); font-weight: 600; font-size: 18px; }
  .progress-right { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--pencil); font-weight: 700; }
  .combo {
    display: none;
    font-family: var(--hand); font-weight: 600; font-size: 14px;
    color: var(--redpen); border: 2px solid var(--redpen); border-radius: 6px;
    padding: 1px 7px; transform: rotate(-6deg); background: rgba(255,255,255,.85);
  }
  .combo.show { display: inline-block; }
  .combo.bump { animation: stamp .35s ease; }
  @keyframes stamp { 0% { transform: rotate(-6deg) scale(1.6); opacity: 0; } 70% { transform: rotate(-6deg) scale(.92); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); } }

  .progress-track { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--ink); border-radius: 99px; transition: width .35s ease; }

  /* 単語カード（リングで綴じた単語帳） */
  .word-card {
    position: relative;
    background: #fff;
    border: 1.5px solid #c9d3de;
    border-radius: 10px;
    padding: 30px 18px 26px 44px;
    text-align: center;
    box-shadow: 0 2px 0 #e6ecf2, 0 4px 0 #d9e1ea, 0 8px 14px rgba(37, 53, 82, .10); /* 下に重なるカード */
    margin: 6px 0 6px;
  }
  .word-card::before { /* パンチ穴 */
    content: ""; position: absolute; left: 14px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
    border-radius: 50%; background: var(--desk); box-shadow: inset 1px 1px 2px rgba(0,0,0,.18);
  }
  .word-card::after { /* リング */
    content: ""; position: absolute; left: -10px; top: 50%; width: 30px; height: 20px; margin-top: -10px;
    border: 4px solid #9fadbd; border-right-color: transparent; border-radius: 50%;
  }
  .word-card.flip { animation: flip .35s ease; transform-origin: 0 50%; }
  @keyframes flip { from { transform: perspective(600px) rotateY(-28deg); opacity: .3; } to { transform: none; opacity: 1; } }
  .range-label { font-size: 13px; color: var(--pencil); margin-bottom: 6px; }
  .word { font-family: var(--hand); font-weight: 600; font-size: 44px; line-height: 1.2; word-break: break-word; }
  .word-rate { font-size: 13px; color: var(--pencil); margin-top: 10px; min-height: 1.4em; }
  .word-rate b { font-family: var(--hand); font-weight: 600; font-size: 16px; color: var(--ink); }

  /* ヒント：水色の付箋 */
  .hint-toggle {
    min-height: 46px; font-size: 16px;
    background: transparent; border: 1.5px dashed var(--pencil); box-shadow: none; color: var(--pencil);
  }
  .hint-toggle:active:not(:disabled) { transform: none; box-shadow: none; }
  .hint-area { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .hint-area.open { grid-template-rows: 1fr; }
  .hint-inner { overflow: hidden; }
  .hint-box {
    background: var(--sticky); padding: 14px 16px 14px;
    border-radius: 2px 2px 12px 2px;
    box-shadow: 2px 3px 6px rgba(37, 53, 82, .12);
    transform: rotate(-.6deg); margin: 4px 4px 8px;
    font-family: var(--hand);
  }
  .hint-sentence { font-size: 18px; font-weight: 600; line-height: 1.55; margin: 0 0 6px; }
  .hint-ja { font-size: 15px; line-height: 1.6; margin: 0; color: #3d4f6c; }

  /* 選択肢 */
  .choices { display: grid; gap: 10px; }
  .choice {
    position: relative;
    text-align: left; padding: 12px 16px; font-size: 18px; font-weight: 700;
    display: flex; align-items: center; gap: 12px;
    border-width: 1.5px;
  }
  .choice .num {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--ink); font-size: 13px; font-weight: 900;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .choice .label { position: relative; z-index: 1; }
  .choice:disabled { opacity: 1; cursor: default; }
  .choice.dim { opacity: .45; }
  .choice.answer-line .label { /* 正解に蛍光ペン */
    background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 62% / 0% 55%;
    animation: marker .45s ease .15s forwards;
  }
  @keyframes marker { to { background-size: 100% 55%; } }
  .redmark { position: absolute; pointer-events: none; overflow: visible; z-index: 2; }
  .redmark path {
    fill: none; stroke: var(--redpen); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .45s ease-out forwards;
  }
  .redmark.circle { inset: -6px -4px; width: calc(100% + 8px); height: calc(100% + 12px); }
  .redmark.check { right: 14px; top: 50%; width: 40px; height: 34px; margin-top: -17px; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .feedback {
    display: none; text-align: center;
    font-family: var(--hand); font-weight: 600; font-size: 22px; line-height: 1.5;
    padding: 6px 4px;
  }
  .feedback.show { display: block; }
  .feedback.ok { color: var(--redpen); }
  .feedback.ng { color: var(--ink); font-size: 19px; }
  #next-btn { display: none; }
  #next-btn.show { display: block; }

  /* ===== 結果画面 ===== */
  #result-screen { gap: 16px; text-align: center; }
  .rank-wrap { position: relative; width: 168px; height: 168px; margin: 4px auto 0; }
  .rank-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .rank-wrap path { fill: none; stroke: var(--redpen); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-out .1s forwards; }
  .rank-letter {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--hand); font-weight: 600; font-size: 76px; color: var(--redpen);
    opacity: 0; animation: appear .3s ease .9s forwards;
  }
  @keyframes appear { to { opacity: 1; } }
  .score { font-family: var(--hand); font-weight: 600; font-size: 40px; margin: 0; }
  .score-msg { font-size: 15px; color: var(--pencil); margin: 0; line-height: 1.7; }
  .review { text-align: left; margin: 6px 0 0; padding: 0; list-style: none; }
  .review li {
    display: flex; align-items: center; gap: 10px;
    min-height: var(--line-h); font-size: 16px;
  }
  .review .mk { flex: 0 0 22px; font-family: var(--hand); font-weight: 600; font-size: 20px; color: var(--redpen); text-align: center; }
  .review b { font-family: var(--hand); font-weight: 600; font-size: 18px; }
  .review .ans { margin-left: auto; color: var(--pencil); font-size: 14px; }
  .result-actions { display: grid; gap: 10px; margin-top: 6px; }

  @media (min-width: 600px) {
    body { padding-top: 32px; }
    .app { min-height: auto; padding: 32px 30px 34px 56px; }
    .app::before { left: 38px; }
    .word { font-size: 50px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="app">

  <!-- タイトル画面 -->
  <section id="title-screen" class="screen active">
    <div>
      <h1 class="title-main">中学英単語<br><span class="mark-line">完全習得ドリル</span></h1>
      <p class="title-sub">英検4級〜1級の単語を、4択でくり返し覚えよう。</p>
    </div>
    <p id="load-status" class="status"><span class="spinner"></span>単語データを読み込み中...</p>

    <div>
      <p class="select-heading">① 生徒番号とニックネーム</p>
      <div class="id-fields">
        <label class="field">
          <span class="field-label">生徒番号</span>
          <input id="student-id" class="name-input" type="text" maxlength="20" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" placeholder="例：A012">
        </label>
        <label class="field">
          <span class="field-label">ニックネーム</span>
          <input id="nickname" class="name-input" type="text" maxlength="20" autocomplete="nickname"
                 placeholder="例：はるちゃん">
        </label>
      </div>
      <p id="totals" class="totals"></p>
    </div>
    <div>
      <p class="select-heading">② 級を選ぶ</p>
      <div id="grades" class="grades"></div>
    </div>
    <div id="chapter-block">
      <p id="chapter-heading" class="select-heading">③ チャプターを選ぶ</p>
      <div id="chapters" class="sets"></div>
    </div>
    <div id="part-block">
      <p id="part-heading" class="select-heading">④ パートを選ぶ</p>
      <div id="parts" class="sets"></div>
    </div>

    <button id="start-btn" class="btn btn-primary" disabled>スタート</button>
  </section>

  <!-- クイズ画面 -->
  <section id="quiz-screen" class="screen">
    <div class="progress-row">
      <span id="progress-text" class="progress-text">第1問 / 全20問</span>
      <span class="progress-right">
        <span id="combo" class="combo"></span>
        <span id="score-text">正解 0</span>
      </span>
    </div>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>

    <div id="word-card" class="word-card">
      <div id="range-label" class="range-label">この英単語の意味は？</div>
      <div id="word" class="word">---</div>
      <div id="word-rate" class="word-rate"></div>
    </div>

    <button id="hint-btn" class="btn hint-toggle" aria-expanded="false" aria-controls="hint-area">ヒントを見る</button>
    <div id="hint-area" class="hint-area" aria-hidden="true">
      <div class="hint-inner">
        <div class="hint-box">
          <p id="hint-sentence" class="hint-sentence"></p>
          <p id="hint-ja" class="hint-ja"></p>
        </div>
      </div>
    </div>

    <div id="choices" class="choices"></div>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    <button id="next-btn" class="btn btn-primary">次へ</button>
  </section>

  <!-- 結果画面 -->
  <section id="result-screen" class="screen">
    <div id="rank" class="rank-wrap" aria-hidden="true"></div>
    <p id="score" class="score">0問正解！</p>
    <p id="score-msg" class="score-msg"></p>
    <p id="record-status" class="record-status"></p>
    <ul id="review" class="review"></ul>
    <div class="result-actions">
      <button id="retry-btn" class="btn btn-primary">もう一度挑戦する</button>
      <button id="next-set-btn" class="btn">次のパートへ</button>
      <button id="back-btn" class="btn">級・チャプター・パートを選び直す</button>
    </div>
  </section>

</main>

<script>
const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7fDrJNr5HALyJWBLEvyOpAUgb2xr_GcVdVlxxgJBaYolIUoOjkm_FtzO4JkIlVJCqWZRMZ6DbqutO/pub?gid=1917643761&single=true&output=csv";

// 成績記録用 Google Apps Script の「ウェブアプリのURL（…/exec）」。空欄なら記録しない
const RECORD_API_URL = "https://script.google.com/macros/s/AKfycby8Sq1Ku9CwDC_51D7h3wkPsBiURxAJDpMKntgQK6Yl_p-SpVNpEdBLdU-ffF3P8u3N/exec";

/* ===== 設定 ===== */
const FETCH_TIMEOUT_MS = 8000; // 通信タイムアウト
const STORAGE_ID_KEY = "eitango_student_id";
const STORAGE_NICK_KEY = "eitango_nickname";
const STORAGE_QUEUE_KEY = "eitango_pending_records";

// 級の表示順。MAIN_GRADES は常に表示、それ以外はデータがあるときだけ表示
const MAIN_GRADES = ["4級", "3級", "準2級", "2級", "準1級", "1級"];
const GRADE_ORDER = ["5級", "4級", "3級", "準2級", "準2級プラス", "2級", "準1級", "1級"];
// 級ボタン上部の色帯（インデックスシールの色）
const GRADE_COLORS = { "5級": "#f4b6c2", "4級": "#9ed8a8", "3級": "#ffd36e", "準2級": "#ffab73", "準2級プラス": "#f28b6b", "2級": "#8ec5f0", "準1級": "#a9a6ec", "1級": "#6e7fd1" };

/*
  CSVの列構成（1行目の項目名で列を探すので、順番を入れ替えても動きます）
  A: number / B: vocab / C: grade / D: chapter / E: part / F: sentence / G: Hint / H: answer / I〜K: dummy1〜3
  ※ 以前の「set」列は part として読み込みます
*/
const DEFAULT_COLUMNS = { number: 0, vocab: 1, grade: 2, chapter: 3, part: 4, sentence: 5, hint: 6, answer: 7, dummy1: 8, dummy2: 9, dummy3: 10 };

/* ===== フォールバック用（予備）データ ===== */
const FALLBACK_WORDS = [
  { vocab: "dog",   grade: "4級", chapter: "1", part: "1", sentence: "I love playing with my【dog】.",                          hint: "僕は自分の【dog】と遊ぶのが大好きなんだ！",       answer: "犬",         dummies: ["友達", "ペット", "弟"] },
  { vocab: "cat",   grade: "4級", chapter: "1", part: "1", sentence: "The【cat】doesn't seem interested in her toy.",             hint: "その【cat】は自分のおもちゃに興味がないみたい。", answer: "猫",         dummies: ["子ども", "オオカミ", "赤ちゃん"] },
  { vocab: "bark",  grade: "4級", chapter: "1", part: "1", sentence: "I tell my dog not to 【bark】.",                            hint: "犬に【bark】しないように言ったんだ。",           answer: "(犬が)鳴く", dummies: ["飛び跳ねる", "喧嘩する", "興奮する"] },
  { vocab: "meow",  grade: "4級", chapter: "1", part: "1", sentence: "I thought I heard a cat 【meow】.",                         hint: "猫が【meow】するのが聞こえた気がしたのに。",     answer: "(猫が)鳴く", dummies: ["悲しむ", "呼ぶ", "ミルクを飲む"] },
  { vocab: "large", grade: "4級", chapter: "1", part: "1", sentence: "This cat isn't as 【large】as that dog.",                   hint: "その猫は犬ほど【large】ではない。",               answer: "大きい",     dummies: ["小さい", "立派な", "可愛い"] },
  { vocab: "small", grade: "4級", chapter: "1", part: "1", sentence: "The kitten is so【small】 that I thought it was an angel.", hint: "その子猫、【small】すぎて天使かと思った。",       answer: "小さい",     dummies: ["大きい", "若い", "美しい"] }
];

/* ===== 状態 ===== */
let wordList = [];
let skippedWords = [];
let selectedGrade = null;
let selectedChapter = null; // チャプターの値（"1" や "動詞" など。空欄は ""）
let selectedPart = null;    // パートの値
let questions = [];
let current = 0;
let score = 0;
let combo = 0;
let maxCombo = 0;
let history = [];

/* ===== 要素 ===== */
const $ = (id) => document.getElementById(id);
const screens = { title: $("title-screen"), quiz: $("quiz-screen"), result: $("result-screen") };

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
  window.scrollTo(0, 0);
}

/* ===== CSVパーサー（ダブルクォート・カンマ・改行入りセル対応） ===== */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  text = text.replace(/^﻿/, ""); // BOM除去
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* 全角英数字→半角、空白除去 */
const toHalf = (s) => (s || "").replace(/[０-９Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/\s+/g, "");

/* 級の表記ゆれをそろえる（例: "準２級"→"準2級", "3"→"3級", "準2+"→"準2級プラス"） */
function normalizeGrade(raw) {
  let g = toHalf(raw).replace(/^英検/, "");
  if (!g) return "";
  g = g.replace(/\+$|＋$/, "プラス");
  if (/^準?\d(プラス)?$/.test(g)) g = g.replace(/^(準?\d)/, "$1級");
  return g;
}

/* チャプター・パートの値をそろえる（"０１"→"1"、"パート2"→"2"。名前で付けた場合はそのまま） */
function normalizeKey(raw) {
  const v = toHalf(raw).replace(/^(chapter|ch\.?|チャプター|part|パート|set|セット)/i, "");
  return /^\d+$/.test(v) ? String(parseInt(v, 10)) : (raw || "").trim();
}

/* 1行目の項目名から列番号を決める */
function detectColumns(header) {
  const names = header.map(h => toHalf(h).toLowerCase());
  if (!names.includes("vocab")) return DEFAULT_COLUMNS;
  const idx = (key) => names.indexOf(key);
  return {
    number: idx("number"), vocab: idx("vocab"), grade: idx("grade"),
    chapter: idx("chapter"), part: idx("part") >= 0 ? idx("part") : idx("set"),
    sentence: idx("sentence"), hint: idx("hint"), answer: idx("answer"),
    dummy1: idx("dummy1"), dummy2: idx("dummy2"), dummy3: idx("dummy3")
  };
}

function rowsToWords(rows) {
  skippedWords = [];
  if (rows.length < 2) return [];
  const col = detectColumns(rows[0]);
  const get = (cols, key) => (col[key] >= 0 ? (cols[col[key]] || "") : "").trim();
  const parsed = rows.slice(1) // 1行目（ヘッダー）を飛ばす
    .map((cols, i) => {
      return {
        number:   parseInt(get(cols, "number"), 10) || (i + 1),
        vocab:    get(cols, "vocab"),
        grade:    normalizeGrade(get(cols, "grade")),
        chapter:  normalizeKey(get(cols, "chapter")), // 空欄は ""（チャプター分けなし）
        part:     normalizeKey(get(cols, "part")),
        sentence: get(cols, "sentence"),
        hint:     get(cols, "hint"),
        answer:   get(cols, "answer"),
        dummies:  ["dummy1", "dummy2", "dummy3"].map(k => get(cols, k)).filter(Boolean)
      };
    })
    .filter(w => w.vocab);
  skippedWords = parsed.filter(w => !w.answer || !w.grade);
  return parsed.filter(w => w.answer && w.grade);
}

/* ===== データ読み込み ===== */
async function loadWords() {
  const status = $("load-status");
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    const res = await fetch(SPREADSHEET_CSV_URL, { signal: controller.signal, cache: "no-store" });
    clearTimeout(timer);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error("CSVではなくHTMLが返されました");
    const words = rowsToWords(parseCSV(text));
    if (words.length === 0) {
      throw new Error(skippedWords.length
        ? `answer（正解）列が空の単語しかありません（${skippedWords.length}語）`
        : "有効な単語データがありません（grade 列を確認してください）");
    }
    wordList = words;
    status.className = "status";
    status.textContent = `✅ ${words.length}語の単語データを読み込みました` +
      (skippedWords.length ? `（answer が空の${skippedWords.length}語は出題されません）` : "");
  } catch (err) {
    console.warn("スプレッドシートの読み込みに失敗。予備データを使用します:", err);
    wordList = FALLBACK_WORDS.map((w, i) => ({ ...w, number: i + 1 }));
    status.className = "status warn";
    const reason = err && err.name === "AbortError" ? "通信がタイムアウトしました"
                 : err && err.name === "TypeError"  ? "通信できませんでした（ネット接続か、開き方を確認してください）"
                 : (err && err.message) || "不明なエラー";
    status.textContent = `⚠️ オンラインのデータを読み込めなかったため、予備データ（${FALLBACK_WORDS.length}語）で出題します\n理由：${reason}`;
  }
  renderSelectors();
}

/* ===== 級・チャプター・パート選択 ===== */
const wordsOf = (grade, chapter, part) => wordList.filter(w =>
  w.grade === grade && (chapter === undefined || w.chapter === chapter) && (part === undefined || w.part === part));

// 数字は小さい順、名前はシートに出てくる順、空欄は最後
function sortKeys(keys, words, field) {
  const firstSeen = {};
  words.forEach(w => { if (!(w[field] in firstSeen)) firstSeen[w[field]] = w.number; });
  const isNum = (k) => /^\d+$/.test(k);
  return [...new Set(keys)].sort((a, b) => {
    if (a === "" || b === "") return a === "" ? 1 : -1;
    if (isNum(a) && isNum(b)) return a - b;
    if (isNum(a) !== isNum(b)) return isNum(a) ? -1 : 1;
    return firstSeen[a] - firstSeen[b];
  });
}
const chaptersOf = (grade) => { const ws = wordsOf(grade); return sortKeys(ws.map(w => w.chapter), ws, "chapter"); };
const partsOf = (grade, chapter) => { const ws = wordsOf(grade, chapter); return sortKeys(ws.map(w => w.part), ws, "part"); };

const chapterLabel = (c) => c === "" ? "" : /^\d+$/.test(c) ? `チャプター${c}` : c;
const partLabel = (p) => p === "" ? "" : /^\d+$/.test(p) ? `パート${p}` : p;
const rangeText = (grade, chapter, part) => [`英検${grade}`, chapterLabel(chapter), partLabel(part)].filter(Boolean).join("・");

// 級の中の「チャプター→パート」の順番（次のパートへ進むときに使う）
function sequenceOf(grade) {
  const seq = [];
  chaptersOf(grade).forEach(c => partsOf(grade, c).forEach(p => seq.push([c, p])));
  return seq;
}

function renderPickButtons(box, keys, selected, countOf, onPick, emptyLabel) {
  box.innerHTML = "";
  keys.forEach(k => {
    const btn = document.createElement("button");
    const isText = k !== "" && !/^\d+$/.test(k);
    btn.className = "btn pick-btn" + (k === selected ? " selected" : "") + (isText || k === "" ? " is-text" : "");
    btn.setAttribute("aria-pressed", String(k === selected));
    btn.innerHTML = `<span class="main"></span><span class="cnt">${countOf(k)}問</span>`;
    btn.querySelector(".main").textContent = k === "" ? emptyLabel : k;
    btn.addEventListener("click", () => onPick(k));
    box.appendChild(btn);
  });
}

function visibleGrades() {
  const known = GRADE_ORDER.filter(g => MAIN_GRADES.includes(g) || wordsOf(g).length > 0);
  const unknown = [...new Set(wordList.map(w => w.grade))].filter(g => !GRADE_ORDER.includes(g));
  return [...known, ...unknown];
}

function renderSelectors() {
  const grades = visibleGrades();
  if (!selectedGrade || wordsOf(selectedGrade).length === 0) {
    selectedGrade = grades.find(g => wordsOf(g).length > 0) || null;
    selectedChapter = null;
    selectedPart = null;
  }

  const gBox = $("grades");
  gBox.innerHTML = "";
  grades.forEach(g => {
    const count = wordsOf(g).length;
    const btn = document.createElement("button");
    btn.className = "btn pick-btn" + (g === selectedGrade ? " selected" : "");
    btn.style.setProperty("--tab", GRADE_COLORS[g] || "#c3ccd8");
    btn.disabled = count === 0;
    btn.setAttribute("aria-pressed", String(g === selectedGrade));
    btn.innerHTML = `<span class="main"></span><span class="cnt">${count ? count + "語" : "準備中"}</span>`;
    btn.querySelector(".main").textContent = g;
    btn.addEventListener("click", () => { selectedGrade = g; selectedChapter = null; selectedPart = null; renderSelectors(); });
    gBox.appendChild(btn);
  });

  // チャプター
  const chapters = selectedGrade ? chaptersOf(selectedGrade) : [];
  if (!chapters.includes(selectedChapter)) { selectedChapter = chapters.length ? chapters[0] : null; selectedPart = null; }
  // 空欄のチャプターしかない級は、チャプター選択を出さない
  const showChapters = !(chapters.length === 1 && chapters[0] === "");
  $("chapter-block").hidden = !showChapters;
  renderPickButtons($("chapters"), chapters, selectedChapter,
    c => wordsOf(selectedGrade, c).length,
    c => { selectedChapter = c; selectedPart = null; renderSelectors(); }, "その他");

  // パート
  const parts = selectedChapter !== null ? partsOf(selectedGrade, selectedChapter) : [];
  if (!parts.includes(selectedPart)) selectedPart = parts.length ? parts[0] : null;
  renderPickButtons($("parts"), parts, selectedPart,
    p => wordsOf(selectedGrade, selectedChapter, p).length,
    p => { selectedPart = p; renderSelectors(); }, "まとめて");
  if (parts.length === 0) $("parts").innerHTML = `<div class="empty-note">単語が登録されている級を選んでください</div>`;

  // 見出しの番号（チャプターを出さないときは詰める）
  $("chapter-heading").textContent = "③ チャプターを選ぶ";
  $("part-heading").textContent = (showChapters ? "④" : "③") + " パートを選ぶ";

  updateStartButton();
}

function updateStartButton() {
  const btn = $("start-btn");
  const missing = !RECORD_API_URL ? "" : !studentId() ? "生徒番号を入れてね" : !nickname() ? "ニックネームを入れてね" : "";
  btn.disabled = selectedPart === null || !!missing;
  btn.textContent = missing && selectedPart !== null ? missing : "スタート";
}

/* ===== 生徒番号・ニックネームと成績記録 ===== */
// 識別は生徒番号（全角→半角、英字は大文字にそろえる）。呼びかけはニックネーム
const studentId = () => $("student-id").value.normalize("NFKC").trim().toUpperCase().slice(0, 20);
const nickname = () => $("nickname").value.normalize("NFKC").trim().slice(0, 20);
const escapeHTML = (s) => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 保存できない環境では何もしない */ } }
};

async function callRecordAPI(payload) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    // text/plain で送ると、ブラウザの事前確認（プリフライト）なしで Apps Script に届く
    const res = await fetch(RECORD_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "記録に失敗しました");
    return data;
  } finally {
    clearTimeout(timer);
  }
}

function totalsText(t) {
  // 生徒には累計正解数だけを見せる（解いた問題数・正答率は先生のシートでのみ確認）
  const nick = nickname();
  const who = nick ? `${escapeHTML(nick)}、` : "";
  if (!t || !t.correct) return `${who}正解するたびに、ここに累計が増えていくよ。`;
  return `${who}これまでに <b>${t.correct}</b>問正解！`;
}

let totalsRequest = 0;
let lastTotals = null; // { id, totals } ニックネームを打ち直したときの表示更新用
async function refreshTotals() {
  const el = $("totals");
  const id = studentId();
  if (!RECORD_API_URL) { el.textContent = ""; return; }
  if (!id) { lastTotals = null; el.textContent = "生徒番号を入れると、これまでの成績が表示されます"; return; }
  const req = ++totalsRequest;
  el.textContent = "成績を読み込み中...";
  try {
    const data = await callRecordAPI({ action: "totals", student: id });
    if (req === totalsRequest) {
      lastTotals = { id, totals: data.totals };
      el.innerHTML = totalsText(data.totals);
    }
  } catch (e) {
    if (req === totalsRequest) el.textContent = "成績を読み込めませんでした（通信を確認してください）";
  }
}

function rerenderTotals() {
  if (lastTotals && lastTotals.id === studentId()) $("totals").innerHTML = totalsText(lastTotals.totals);
}

/* ===== みんなの正答率 ===== */
const MIN_ATTEMPTS_FOR_RATE = 3; // この回数以上解かれた単語だけ正答率を出す
let wordStats = {};              // { "3級|make": [解答数, 正解数] }

async function loadWordStats() {
  if (!RECORD_API_URL) return;
  try {
    const data = await callRecordAPI({ action: "wordStats" });
    wordStats = data.stats || {};
  } catch (e) {
    /* 読めなくてもクイズは続けられる */
  }
}

function wordRateHTML(q) {
  if (!RECORD_API_URL) return "";
  const s = wordStats[`${q.grade}|${q.vocab}`];
  if (!s || s[0] < MIN_ATTEMPTS_FOR_RATE) return "みんなの正答率：集計中";
  return `みんなの正答率 <b>${Math.round((s[1] / s[0]) * 100)}%</b>`;
}

// 送れなかった記録は端末に保存しておき、次の機会に送り直す
async function flushQueue() {
  if (!RECORD_API_URL) return null;
  let queue = store.get(STORAGE_QUEUE_KEY, []);
  let lastTotals = null;
  while (queue.length) {
    try {
      const data = await callRecordAPI(queue[0]);
      lastTotals = data.totals;
      queue = queue.slice(1);
      store.set(STORAGE_QUEUE_KEY, queue);
    } catch (e) {
      break;
    }
  }
  return { remaining: queue.length, totals: lastTotals };
}

async function saveRecord(record) {
  const status = $("record-status");
  if (!RECORD_API_URL) { status.textContent = ""; return; }
  status.className = "record-status";
  status.textContent = "成績を記録しています...";
  store.set(STORAGE_QUEUE_KEY, [...store.get(STORAGE_QUEUE_KEY, []), record]);
  const result = await flushQueue();
  if (result && result.remaining === 0) {
    const t = result.totals;
    status.className = "record-status ok";
    status.textContent = t ? `✅ 記録しました。これまでに ${t.correct}問正解！` : "✅ 記録しました";
    loadWordStats(); // 今回の解答を反映した正答率を読み直す
  } else {
    status.className = "record-status warn";
    status.textContent = "⚠️ 記録を送れませんでした。次にアプリを開いたときに自動で送り直します。";
  }
}

/* ===== ユーティリティ ===== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildChoices(word) {
  let dummies = [...new Set(word.dummies)].filter(d => d !== word.answer);
  // ダミーが3つ未満の場合は他の単語の正解で補う（同じ級を優先）
  if (dummies.length < 3) {
    const same = shuffle(wordsOf(word.grade).map(w => w.answer));
    const other = shuffle(wordList.filter(w => w.grade !== word.grade).map(w => w.answer));
    const pool = [...new Set([...same, ...other])]
      .filter(a => a !== word.answer && !dummies.includes(a));
    dummies = dummies.concat(pool).slice(0, 3);
  }
  return shuffle([word.answer, ...dummies.slice(0, 3)]);
}

/* ===== 赤ペンの印（SVG） ===== */
const SVG_NS = "http://www.w3.org/2000/svg";
function redMark(type) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.classList.add("redmark", type);
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(SVG_NS, "path");
  if (type === "circle") {
    svg.setAttribute("viewBox", "0 0 100 40");
    svg.setAttribute("preserveAspectRatio", "none");
    path.setAttribute("d", "M54 3 C 82 2, 98 10, 97 20 C 96 32, 72 38, 48 37 C 22 36, 3 30, 3 19 C 3 9, 24 3, 46 3 C 58 3, 66 5, 70 7");
  } else {
    svg.setAttribute("viewBox", "0 0 40 34");
    path.setAttribute("d", "M5 17 L15 29 L36 4");
  }
  path.setAttribute("pathLength", "1");
  path.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(path);
  return svg;
}

/* はなまる（花丸）とランク用の丸 */
function rankSVG(isHanamaru) {
  const cx = 84, cy = 84;
  let d = "";
  if (isHanamaru) {
    // 内側のぐるぐる
    const turns = 2.6, steps = 120;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, a = -Math.PI / 2 + t * turns * Math.PI * 2, r = 8 + t * 38;
      d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1) + " ";
    }
    // 外側の花びら
    const petals = 9, R = 62;
    for (let i = 0; i <= petals; i++) {
      const a = -Math.PI / 2 + (i / petals) * Math.PI * 2;
      const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
      d += (i ? `A 22 22 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)} ` : `M ${x.toFixed(1)} ${y.toFixed(1)} `);
    }
  } else {
    d = "M92 14 C 132 16, 156 46, 154 86 C 152 128, 120 154, 82 152 C 42 150, 14 122, 16 82 C 18 44, 46 16, 86 15 C 104 15, 118 20, 128 28";
  }
  return `<svg viewBox="0 0 168 168"><path pathLength="1" d="${d}"/></svg>`;
}

/* ===== ゲーム進行 ===== */
function startGame() {
  if (selectedPart === null) return;
  questions = shuffle(wordsOf(selectedGrade, selectedChapter, selectedPart))
    .map(w => ({ ...w, choices: buildChoices(w) }));
  if (questions.length === 0) return;
  current = 0;
  score = 0;
  combo = 0;
  maxCombo = 0;
  history = [];
  $("range-label").textContent = rangeText(selectedGrade, selectedChapter, selectedPart);
  updateCombo(false);
  showScreen("quiz");
  renderQuestion();
}

function setHint(open) {
  $("hint-area").classList.toggle("open", open);
  $("hint-area").setAttribute("aria-hidden", String(!open));
  $("hint-btn").setAttribute("aria-expanded", String(open));
  $("hint-btn").textContent = open ? "ヒントを閉じる" : "ヒントを見る";
}

function updateCombo(bump) {
  const el = $("combo");
  el.classList.toggle("show", combo >= 2);
  el.textContent = `${combo}問連続！`;
  if (bump && combo >= 2) {
    el.classList.remove("bump");
    void el.offsetWidth; // アニメーションをやり直す
    el.classList.add("bump");
  }
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;
  $("progress-text").textContent = `第${current + 1}問 / 全${total}問`;
  $("score-text").textContent = `正解 ${score}`;
  $("progress-fill").style.width = `${(current / total) * 100}%`;
  $("word").textContent = q.vocab;
  $("word-rate").innerHTML = wordRateHTML(q);

  const card = $("word-card");
  card.classList.remove("flip");
  void card.offsetWidth;
  card.classList.add("flip");

  // ヒントは毎問リセット（非表示）
  setHint(false);
  $("hint-sentence").textContent = q.sentence || "（例文はありません）";
  $("hint-ja").textContent = q.hint || "";
  $("hint-btn").style.display = (q.sentence || q.hint) ? "" : "none";

  const box = $("choices");
  box.innerHTML = "";
  q.choices.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "btn choice";
    btn.innerHTML = `<span class="num">${i + 1}</span><span class="label"></span>`;
    btn.querySelector(".label").textContent = choice;
    btn.addEventListener("click", () => answer(btn, choice));
    box.appendChild(btn);
  });

  const fb = $("feedback");
  fb.className = "feedback";
  fb.textContent = "";
  $("next-btn").classList.remove("show");
}

function answer(selectedBtn, choice) {
  const q = questions[current];
  const isCorrect = choice === q.answer;
  if (isCorrect) { score++; combo++; maxCombo = Math.max(maxCombo, combo); }
  else combo = 0;
  history.push({ vocab: q.vocab, answer: q.answer, correct: isCorrect });

  document.querySelectorAll(".choice").forEach(btn => {
    btn.disabled = true;
    const isAnswer = btn.querySelector(".label").textContent === q.answer;
    if (btn === selectedBtn && isCorrect) btn.appendChild(redMark("circle"));
    else if (btn === selectedBtn) btn.appendChild(redMark("check"));
    else if (!isAnswer) btn.classList.add("dim");
    if (isAnswer && !isCorrect) btn.classList.add("answer-line");
  });

  const fb = $("feedback");
  if (isCorrect) {
    fb.textContent = combo >= 2 ? `⭕ 正解！（${combo}問連続）` : "⭕ 正解！";
    fb.className = "feedback show ok";
  } else {
    fb.textContent = `❌ 残念！正解は「${q.answer}」`;
    fb.className = "feedback show ng";
  }
  $("score-text").textContent = `正解 ${score}`;
  updateCombo(isCorrect);

  const next = $("next-btn");
  next.textContent = current + 1 < questions.length ? "次へ" : "結果を見る";
  next.classList.add("show");
  next.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function nextQuestion() {
  current++;
  if (current < questions.length) renderQuestion();
  else showResult();
}

// 次に解くパート [チャプター, パート]。チャプターの最後なら次のチャプターの最初のパートへ
function nextPartOf(grade, chapter, part) {
  const seq = sequenceOf(grade);
  const i = seq.findIndex(([c, p]) => c === chapter && p === part);
  return i >= 0 && i + 1 < seq.length ? seq[i + 1] : null;
}

function rankOf(rate) {
  if (rate === 1)  return { rank: "S", msg: "全問正解、はなまる！" };
  if (rate >= .8)  return { rank: "A", msg: "あと少しで全問正解！" };
  if (rate >= .6)  return { rank: "B", msg: "その調子。間違えた単語をもう一度見ておこう。" };
  return { rank: "C", msg: "ヒントの例文を読んでから、もう一度挑戦してみよう。" };
}

function showResult() {
  const total = questions.length;
  const { rank, msg } = rankOf(score / total);

  $("rank").innerHTML = rankSVG(rank === "S") + (rank === "S" ? "" : `<div class="rank-letter">${rank}</div>`);
  $("score").textContent = `${score}問正解！`;
  $("score-msg").textContent =
    `${rangeText(selectedGrade, selectedChapter, selectedPart)}　${total}問中${score}問` +
    (maxCombo >= 2 ? `／最高${maxCombo}問連続` : "") + `\n${nickname() ? nickname() + "、" : ""}${msg}`;
  $("score-msg").style.whiteSpace = "pre-line";

  const review = $("review");
  review.innerHTML = "";
  history.forEach(h => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="mk">${h.correct ? "◯" : "✓"}</span><b></b><span class="ans"></span>`;
    li.querySelector("b").textContent = h.vocab;
    li.querySelector(".ans").textContent = h.answer;
    li.setAttribute("aria-label", `${h.vocab}：${h.answer}（${h.correct ? "正解" : "不正解"}）`);
    review.appendChild(li);
  });

  const next = nextPartOf(selectedGrade, selectedChapter, selectedPart);
  const nextBtn = $("next-set-btn");
  nextBtn.style.display = next === null ? "none" : "";
  if (next !== null) {
    // 同じチャプター内なら「パート3」、次のチャプターに進むなら「チャプター2・パート1」
    const label = next[0] === selectedChapter
      ? partLabel(next[1]) || "続き"
      : [chapterLabel(next[0]), partLabel(next[1])].filter(Boolean).join("・") || "続き";
    nextBtn.textContent = `次のパートへ（${label}）`;
  }

  showScreen("result");

  saveRecord({
    action: "record",
    student: studentId(),
    nickname: nickname(),
    grade: selectedGrade,
    chapter: chapterLabel(selectedChapter),
    part: partLabel(selectedPart),
    correct: score,
    total,
    maxCombo,
    missed: history.filter(h => !h.correct).map(h => h.vocab),
    answers: history.map(h => ({ vocab: h.vocab, correct: h.correct })),
    playedAt: new Date().toISOString()
  });
}

/* ===== イベント ===== */
$("start-btn").addEventListener("click", startGame);
$("next-btn").addEventListener("click", nextQuestion);
$("retry-btn").addEventListener("click", startGame);
$("next-set-btn").addEventListener("click", () => {
  const next = nextPartOf(selectedGrade, selectedChapter, selectedPart);
  if (next !== null) { [selectedChapter, selectedPart] = next; renderSelectors(); startGame(); }
});
$("back-btn").addEventListener("click", () => { renderSelectors(); refreshTotals(); showScreen("title"); });

// 生徒番号とニックネーム：端末に覚えておく。番号が決まったら累計を読み込む
$("student-id").value = store.get(STORAGE_ID_KEY, "");
$("nickname").value = store.get(STORAGE_NICK_KEY, "");
$("student-id").addEventListener("input", () => { store.set(STORAGE_ID_KEY, $("student-id").value); lastTotals = null; updateStartButton(); });
$("student-id").addEventListener("change", refreshTotals);
$("nickname").addEventListener("input", () => { store.set(STORAGE_NICK_KEY, $("nickname").value); updateStartButton(); rerenderTotals(); });
flushQueue().then(() => { refreshTotals(); loadWordStats(); });
$("hint-btn").addEventListener("click", () => {
  setHint(!$("hint-area").classList.contains("open"));
});

loadWords();
</script>
